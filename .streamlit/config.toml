# BI Steward design system (docs/steward/DESIGN.md): dark, dense, one surface with the login globe.
# Tokens (keep in sync with frontend/ui.py and frontend/steward.css): ground #09090B, panel #111114, raised #18181B,
# line #27272A, text #FAFAFA / #A1A1AA, accent #1A4BE0 (#3B6BFF focus, #6B8CFF accent text). Fonts self-hosted
# (Instrument Sans for UI, Geist Mono for numbers and ids), so `make demo` runs offline. Contrast >= 4.5:1 checked.
[theme]
base = "dark"
primaryColor = "#1A4BE0"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#18181B"
textColor = "#FAFAFA"
linkColor = "#6B8CFF"
borderColor = "#27272A"
showWidgetBorder = true
showSidebarBorder = true
font = "Instrument Sans"
codeFont = "Geist Mono"
baseFontSize = 14
baseRadius = "0.4rem"
buttonRadius = "0.4rem"
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontWeight = 600
greenColor = "#4ADE80"
redColor = "#F87171"
orangeColor = "#FBBF24"
blueColor = "#6B8CFF"
dataframeHeaderBackgroundColor = "#18181B"
chartCategoricalColors = ["#3B6BFF", "#A1A1AA", "#FBBF24", "#4ADE80", "#FAFAFA", "#71717A"]

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/InstrumentSans-Regular.ttf"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/InstrumentSans-Bold.ttf"
weight = "600 700"
style = "normal"

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/InstrumentSans-Italic.ttf"
weight = "400"
style = "italic"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/GeistMono-Regular.ttf"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/GeistMono-Medium.ttf"
weight = "500 700"
style = "normal"

[theme.sidebar]
backgroundColor = "#111114"
secondaryBackgroundColor = "#18181B"
textColor = "#FAFAFA"

[server]
headless = true
runOnSave = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
