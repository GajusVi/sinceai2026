# BI Steward design system (docs/steward/DESIGN.md), concept "the ruling".
# Taste skill: palette white-link-blue and type Instrument Sans from its library/ (font self-hosted in frontend/static,
# OFL, so `make demo` runs offline). Flat fills, one accent; contrast checked >= 4.5:1. Component CSS: frontend/steward.css.
[theme]
base = "light"
primaryColor = "#1A4BE0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F4"
textColor = "#111111"
linkColor = "#1A4BE0"
borderColor = "#EBEBEB"
showWidgetBorder = false
showSidebarBorder = false
font = "Instrument Sans"
codeFont = "monospace"
baseFontSize = 15
baseRadius = "0.6rem"
buttonRadius = "999px"
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontWeight = 600
greenColor = "#15803D"
redColor = "#B91C1C"
orangeColor = "#B45309"
blueColor = "#1A4BE0"
dataframeHeaderBackgroundColor = "#F4F4F4"
chartCategoricalColors = ["#1A4BE0", "#6B6B6B", "#B45309", "#15803D", "#111111", "#A3A3A3"]

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/InstrumentSans-Regular.ttf"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/InstrumentSans-Bold.ttf"
weight = "600 700"
style = "normal"

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/InstrumentSans-Italic.ttf"
weight = "400"
style = "italic"

[theme.sidebar]
backgroundColor = "#F4F4F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111111"

[server]
headless = true
runOnSave = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
